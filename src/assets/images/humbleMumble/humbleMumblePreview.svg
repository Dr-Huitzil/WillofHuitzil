<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgHumble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1018" />
      <stop offset="100%" stop-color="#101e2c" />
    </linearGradient>
    <pattern id="gridHumble" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(23,197,245,0.08)" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bgHumble)" />
  <rect width="800" height="450" fill="url(#gridHumble)" />

  <rect x="44" y="42" width="712" height="366" rx="6" fill="rgba(11,20,32,0.92)" stroke="#17c5f5" stroke-opacity="0.45" stroke-width="1.5" />
  <line x1="44" y1="86" x2="756" y2="86" stroke="#17c5f5" stroke-opacity="0.25" stroke-width="1" />
  <circle cx="70" cy="64" r="5" fill="#ea4040" />
  <circle cx="90" cy="64" r="5" fill="#f4d35e" />
  <circle cx="110" cy="64" r="5" fill="#52b788" />
  <text x="136" y="69" fill="#a0c0d8" font-family="Fira Code, Consolas, monospace" font-size="14">python ./humble_mumble_reconcile.py --sources ninja,huntress,ad</text>

  <g font-family="Fira Code, Consolas, monospace" font-size="13">
    <rect x="76" y="118" width="190" height="72" rx="4" fill="rgba(18,34,50,0.9)" stroke="#17c5f5" stroke-opacity="0.6" />
    <text x="92" y="144" fill="#17c5f5" font-weight="600">01 // INGESTION</text>
    <text x="92" y="166" fill="#f4ebd0">NinjaOne + EDR + AD</text>
    <text x="92" y="182" fill="#a0c0d8" font-size="11">500+ Endpoint Telemetry</text>

    <line x1="266" y1="154" x2="305" y2="154" stroke="#17c5f5" stroke-width="1.5" />
    <polygon points="305,149 315,154 305,159" fill="#17c5f5" />

    <rect x="315" y="118" width="190" height="72" rx="4" fill="rgba(18,34,50,0.9)" stroke="#52b788" stroke-opacity="0.7" />
    <text x="331" y="144" fill="#52b788" font-weight="600">02 // RECONCILE</text>
    <text x="331" y="166" fill="#f4ebd0">Tri-Source Cross-Ref</text>
    <text x="331" y="182" fill="#a0c0d8" font-size="11">Detect Orphaned Nodes</text>

    <line x1="505" y1="154" x2="544" y2="154" stroke="#17c5f5" stroke-width="1.5" />
    <polygon points="544,149 554,154 544,159" fill="#17c5f5" />

    <rect x="554" y="118" width="170" height="72" rx="4" fill="rgba(18,34,50,0.9)" stroke="#f4d35e" stroke-opacity="0.65" />
    <text x="570" y="144" fill="#f4d35e" font-weight="600">03 // REMEDIATE</text>
    <text x="570" y="166" fill="#f4ebd0">Google Tasks + XLSX</text>
    <text x="570" y="182" fill="#a0c0d8" font-size="11">Auto-Dispatch Tickets</text>
  </g>

  <g font-family="Fira Code, Consolas, monospace" font-size="13" fill="#a0c0d8">
    <text x="76" y="232" fill="#17c5f5">[OK]</text>
    <text x="122" y="232" fill="#f4ebd0">Normalized 520 hostnames and BIOS serial numbers across consoles</text>
    <text x="76" y="258" fill="#f4d35e">[WARN]</text>
    <text x="122" y="258" fill="#f4ebd0">Identified 14 Active Directory records lacking Huntress EDR telemetry</text>
    <text x="76" y="284" fill="#52b788">[DISPATCH]</text>
    <text x="122" y="284" fill="#f4ebd0">Dispatched 14 remediation action items to Google Tasks via REST API</text>
    <text x="76" y="310" fill="#52b788">[REPORT]</text>
    <text x="122" y="310" fill="#f4ebd0">Exported audit workbook: fleet_hygiene_reconciliation_report.xlsx</text>
  </g>
</svg>
