      <stop offset="0%" stop-color="#14110e" />
      <stop offset="100%" stop-color="#221912" />
    </linearGradient>
    <pattern id="gridRobo" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(244,211,94,0.08)" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bgRobo)" />
